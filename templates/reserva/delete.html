{% extends 'base/base.html' %}

{% block titulo %}Eliminar Reserva — CTP A. M. Marte{% endblock %}


{% block contenido %}
<div class="delete-container">
    <div class="delete-header-icon">
        <i class="fa-solid fa-triangle-exclamation"></i>
    </div>

    <div class="delete-body">
        <h2 class="delete-title">¿Confirmar eliminación?</h2>
        <p class="delete-message">
            Esta acción no se puede deshacer. Estás a punto de cancelar/eliminar el registro de reserva:
            <span class="delete-object-name">{{ object }}</span>
        </p>

        <form method="post" class="delete-actions">
            {% csrf_token %}
            <a href="{% url 'reserva:reserva_list' %}" class="btn-cancel">
                <i class="fa-solid fa-xmark"></i> Cancelar
            </a>
            <button type="submit" class="btn-danger-confirm">
                <i class="fa-solid fa-trash-can"></i> Sí, Eliminar
            </button>
        </form>
    </div>
</div>
{% endblock %}
