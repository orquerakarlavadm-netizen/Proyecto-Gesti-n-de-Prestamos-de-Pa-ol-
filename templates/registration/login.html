{% extends "base/base.html" %}

{% block titulo %}Iniciar Sesión — Pañol CTPAMM{% endblock %}

{% block contenido %}
<div style="max-width: 420px; margin: 3rem auto; background: #FFFFFF; border-radius: 8px; border: 1px solid #E2E8F0; border-t
op: 5px solid #0096D6; padding: 2rem; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
    <h2 style="color: #0096D6; text-align: center; margin-top: 0;">Ingreso al Sistema</h2>
    <p style="text-align: center; color: #718096; font-size: 0.9rem; margin-bottom: 1.5rem;">Credenciales institucionales del
Pañol</p>

    <form method="post">
        {% csrf_token %}
        <div style="margin-bottom: 1rem;">
            {{ form.as_p }}
        </div>
        <button type="submit" style="width: 100%; background-color: #F57C00; color: #FFFFFF; border: none; padding: 0.75rem;
border-radius: 4px; font-weight: 700; font-size: 1rem; cursor: pointer;">Ingresar</button>
    </form>
</div>
{% endblock %}
