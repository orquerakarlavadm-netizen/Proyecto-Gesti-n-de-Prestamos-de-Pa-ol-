{% extends 'base/base.html' %}

{% block titulo %}
  Editar Recurso: {{ object }} — CTP A. M. Marte
{% endblock %}


{% block contenido %}
<div class="form-container">
    <div class="form-header">
        <i class="fa-solid fa-pen-to-square"></i>
        <h2 class="form-header-title">Editar Recurso</h2>
    </div>

    <form method="post" class="form-body">
        {% csrf_token %}
        
        {{ form.as_p }}

        <div class="form-actions">
            <a href="{% url 'recurso:recurso_list' %}" class="btn-cancel">
                <i class="fa-solid fa-xmark"></i> Cancelar
            </a>
            <button type="submit" class="btn-submit">
                <i class="fa-solid fa-rotate"></i> Actualizar Recurso
            </button>
        </div>
    </form>
</div>
{% endblock %}
