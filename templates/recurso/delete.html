{% extends "base/base.html" %}
{% block titulo %}Eliminar Registro{% endblock %}
{% block contenido %}
<div style="background: #FFFFFF; border: 1px solid #E2E8F0; border-top: 4px solid #E53E3E; border-radius: 8px; padding: 2rem; max-width: 500px; margin: 0 auto; text-align: center;">
    <h2 style="color: #E53E3E; margin-top: 0;">¿Confirmar eliminación?</h2>
    <p style="color: #4A5568;">Se eliminará permanentemente: <strong>{{ object }}</strong>.</p>
    <form method="post" style="margin-top: 1.5rem;">
        {% csrf_token %}
        <button type="submit" style="background-color: #E53E3E; color: #FFFFFF; border: none; padding: 0.6rem 1.2rem; border-radius: 4px; font-weight: 600; cursor: pointer;">Sí, Eliminar</button>
        <a href="{% url 'recurso:recurso_list' %}" style="background-color: #EDF2F7; color: #4A5568; padding: 0.6rem 1.2rem; border-radius: 4px; text-decoration: none; font-weight: 600; margin-left: 0.5rem;">Cancelar</a>
    </form>
</div>
{% endblock %}
