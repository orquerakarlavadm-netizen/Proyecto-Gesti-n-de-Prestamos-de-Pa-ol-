{% extends "base/base.html" %}
{% block titulo %}Actualizar Materia — Pañol CTPAMM{% endblock %}
{% block contenido %}
<div class="form-card">
    <h2>Actualizar Materia</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="acciones-form">
            <button type="submit" class="btn-primary">Guardar Cambios</button>
            <a href="{% url 'materia:materia_list' %}" class="btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
